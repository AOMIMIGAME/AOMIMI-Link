# AOMIMI Link の CIA を作る。
# - main への push / プルリクエスト / 手動: 作って Artifact に置くだけ
# - v で始まるタグの push: 作ってリリースに出す（最新のリリースになる）
# - follow-upstream.yml から呼ばれたとき: 渡された版でリリースに出す
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      release_tag:
        description: Release tag to publish
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build the CIA
        run: SRC="$GITHUB_WORKSPACE" bash build-in-docker.sh

      - name: Name the CIA
        run: cp app/nimbus.cia aomimi-link.cia

      - uses: actions/upload-artifact@v4
        with:
          name: aomimi-link
          path: aomimi-link.cia

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: aomimi-link.cia
          make_latest: true
          body: |
            AOMIMI Link — AOMIMI Network / Pretendo Network / Nintendo のアカウントを切り替えます（Azahar 用）。

            FBI の「Remote Install → Scan QR Code」で入れられます。いつも最新を入れる URL:
            https://github.com/AOMIMIGAME/AOMIMI-Link/releases/latest/download/aomimi-link.cia

            Based on Nimbus by Pretendo Network (GPL-3.0). Not affiliated with Pretendo Network or Nintendo.
            変更点は AOMIMI.md を見てください。
